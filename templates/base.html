<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{% block title %}智能自助咖啡机{% endblock %}</title>
    
    <!-- 预加载关键资源 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 自定义CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    {% block head %}{% endblock %}
    
    <style>
        /* 全局触控优化 */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 确保字体渲染优化 */
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            font-feature-settings: 'kern' 1, 'liga' 1;
            text-rendering: optimizeLegibility;
        }
        
        /* 触控目标最小尺寸强制执行 */
        .btn, .card, .touch-target, button, [role="button"] {
            min-height: var(--touch-min);
            min-width: var(--touch-min);
        }
        
        /* 高性能设备的增强效果 */
        @media (min-resolution: 2dppx) and (min-width: 1024px) {
            .product-card {
                will-change: transform;
            }
            
            .btn-cyber {
                will-change: transform, box-shadow;
            }
        }
        
        /* 低性能设备的降级 */
        @media (max-resolution: 1dppx), (max-width: 768px) {
            .glass,
            .glass-hover {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(255, 255, 255, 0.15);
            }
        }
    </style>
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- 顶部状态栏 -->
    <div class="status-bar">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-auto">
                    <div class="status-indicator">
                        <div class="status-dot status-online"></div>
                        <span id="currentTime"></span>
                    </div>
                </div>
                <div class="col text-center">
                    <div class="status-indicator">
                        <i class="fas fa-signal"></i>
                        <span>在线</span>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="status-indicator">
                        <i class="fas fa-coffee"></i>
                        <span id="availableCount">--</span>
                        <small>款可选</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 主要内容区域 -->
    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <!-- 全局提示容器 -->
    <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index: var(--z-toast);"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 主要 JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <script>
        // 实时时钟更新
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit'
            });
            const timeElement = document.getElementById('currentTime');
            if (timeElement) {
                timeElement.textContent = timeStr;
            }
        }
        
        // 初始化并每秒更新时钟
        updateClock();
        setInterval(updateClock, 1000);
        
        // 初始化咖啡机系统
        if (window.CoffeeMachine) {
            window.CoffeeMachine.init();
        }
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
