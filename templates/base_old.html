<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}智能自助咖啡机{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 自定义CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    {% block head %}{% endblock %}
    
    <style>
        /* 触控优化 */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* 触控目标最小尺寸 */
        .btn, .card, .touch-target {
            min-height: 44px;
            min-width: 44px;
        }
        
        .btn {
            font-size: 1.1rem;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.9);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        
        /* 全屏布局 */
        .fullscreen {
            height: 100vh;
            overflow: hidden;
        }
        
        /* 运维入口（隐形） */
        .maintenance-entry {
            position: fixed;
            top: 0;
            right: 0;
            width: 120px;
            height: 120px;
            background: transparent;
            border: none;
            z-index: 9999;
            cursor: default;
        }
        
        /* 状态指示器 */
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .status-online { background-color: #28a745; }
        .status-offline { background-color: #dc3545; }
        .status-warning { background-color: #ffc107; }
        
        /* 进度条 */
        .progress {
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        /* 二维码样式 */
        .qr-code {
            max-width: 300px;
            max-height: 300px;
            border: 8px solid white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        /* 制作动画 */
        .brewing-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* 低量警告 */
        .low-stock-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #dc3545;
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        
        /* 触控友好的输入 */
        .form-control {
            font-size: 1.2rem;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        
        /* 响应式字体 */
        @media (max-width: 768px) {
            body { font-size: 1.1rem; }
            .btn { font-size: 1.2rem; padding: 14px 28px; }
        }
    </style>
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- 运维入口按钮（隐形） -->
    <button class="maintenance-entry" id="maintenanceEntry" type="button"></button>
    
    {% block content %}{% endblock %}
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 通用JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <script>
        // 运维入口长按检测
        let maintenancePressTimer = null;
        let maintenancePressStart = 0;
        
        document.getElementById('maintenanceEntry').addEventListener('touchstart', function(e) {
            e.preventDefault();
            maintenancePressStart = Date.now();
            maintenancePressTimer = setTimeout(() => {
                if (Date.now() - maintenancePressStart >= 3000) {
                    window.location.href = '/maintenance/pin';
                }
            }, 3000);
        });
        
        document.getElementById('maintenanceEntry').addEventListener('touchend', function(e) {
            e.preventDefault();
            if (maintenancePressTimer) {
                clearTimeout(maintenancePressTimer);
                maintenancePressTimer = null;
            }
        });
        
        // 桌面环境支持
        document.getElementById('maintenanceEntry').addEventListener('mousedown', function(e) {
            e.preventDefault();
            maintenancePressStart = Date.now();
            maintenancePressTimer = setTimeout(() => {
                if (Date.now() - maintenancePressStart >= 3000) {
                    window.location.href = '/maintenance/pin';
                }
            }, 3000);
        });
        
        document.getElementById('maintenanceEntry').addEventListener('mouseup', function(e) {
            e.preventDefault();
            if (maintenancePressTimer) {
                clearTimeout(maintenancePressTimer);
                maintenancePressTimer = null;
            }
        });
        
        // 全局错误处理
        window.addEventListener('error', function(e) {
            console.error('页面错误:', e.error);
            // 这里可以添加错误上报逻辑
        });
        
        // 网络状态监听
        window.addEventListener('online', function() {
            console.log('网络已连接');
            // 可以显示网络恢复提示
        });
        
        window.addEventListener('offline', function() {
            console.log('网络已断开');
            // 可以显示离线提示
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
